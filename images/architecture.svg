<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1000" viewBox="0 0 1080 1000">
  <defs>
    <style>
      text    { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", "SimHei", sans-serif; }
      .h1     { font-size: 21px; font-weight: 700; fill: #1a237e; text-anchor: middle; letter-spacing: 1px; }
      .sub    { font-size: 13px; fill: #616161; text-anchor: middle; letter-spacing: .5px; }
      .hdr    { font-size: 15px; font-weight: 700; fill: #ffffff; letter-spacing: .5px; }
      .hdrR   { font-size: 11px; fill: #ffffff; text-anchor: end; opacity: .95; }
      .mTitle { font-size: 13px; font-weight: 700; fill: #212529; text-anchor: middle; }
      .mSub   { font-size: 10px; fill: #555f66; text-anchor: middle; }
      .mSubSm { font-size: 9px;  fill: #555f66; text-anchor: middle; }
      .note   { font-size: 11px; fill: #2e7d32; text-anchor: end; }
      .flowLb { font-size: 10.5px; fill: #37474f; }
      .fbLb   { font-size: 10px; fill: #e53935; text-anchor: middle; }
      .banT   { font-size: 12px; font-weight: 700; fill: #bf360c; text-anchor: middle; }
      .lgT    { font-size: 11px; fill: #37474f; }
      .lgNote { font-size: 11px; fill: #455a64; }
      .req    { fill: none; stroke: #37474f; stroke-width: 2.2; }
      .res    { fill: none; stroke: #43a047; stroke-width: 2; }
      .fb     { fill: none; stroke: #e53935; stroke-width: 1.8; stroke-dasharray: 6 4; stroke-linecap: round; }
      .bind   { fill: none; stroke: #90a4ae; stroke-width: 1.4; stroke-linecap: round; }
      .sep    { stroke: #eeeeee; stroke-width: 1; }
    </style>

    <!-- 箭头 -->
    <marker id="mDark" markerWidth="10" markerHeight="8" refX="8.5" refY="4" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#37474f"/>
    </marker>
    <marker id="mGreen" markerWidth="10" markerHeight="8" refX="8.5" refY="4" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#43a047"/>
    </marker>
    <marker id="mRed" markerWidth="10" markerHeight="8" refX="8.5" refY="4" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#e53935"/>
    </marker>
    <marker id="mGray" markerWidth="9" markerHeight="7" refX="7.5" refY="3.5" orient="auto">
      <polygon points="0,0 9,3.5 0,7" fill="#90a4ae"/>
    </marker>

    <!-- 层标题渐变 -->
    <linearGradient id="gGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#43a047"/><stop offset="1" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="gBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e88e5"/><stop offset="1" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="gOrange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fb8c00"/><stop offset="1" stop-color="#ef6c00"/>
    </linearGradient>
    <linearGradient id="gPurple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8e24aa"/><stop offset="1" stop-color="#6a1b9a"/>
    </linearGradient>
    <linearGradient id="gDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#546e7a"/><stop offset="1" stop-color="#37474f"/>
    </linearGradient>
    <linearGradient id="gDivider" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a237e"/>
      <stop offset="0.55" stop-color="#1e88e5"/>
      <stop offset="1" stop-color="#90caf9" stop-opacity="0.15"/>
    </linearGradient>

    <!-- 阴影 -->
    <filter id="fLayer" x="-4%" y="-8%" width="108%" height="120%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="4" flood-color="#263238" flood-opacity="0.12"/>
    </filter>
    <filter id="fCard" x="-8%" y="-14%" width="116%" height="132%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.6" flood-color="#37474f" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1080" height="1000" fill="#f8fafc"/>

  <!-- ================= 标题 ================= -->
  <text x="540" y="36" class="h1">面向 AIPC 的异构多框架模型动态调度系统架构</text>
  <text x="540" y="57" class="sub">统一接入 · 分层调度 · 确定性调度算法</text>
  <rect x="70" y="64" width="940" height="2.5" rx="1.25" fill="url(#gDivider)"/>

  <!-- ================= ① 应用层 ================= -->
  <g transform="translate(70,84)">
    <rect x="0" y="0" width="940" height="96" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.6" filter="url(#fLayer)"/>
    <path d="M0,30 V10 Q0,0 10,0 H930 Q940,0 940,10 V30 Z" fill="url(#gGreen)"/>
    <text x="14" y="21" class="hdr">① 应用层（Application Layer）</text>
    <rect x="320" y="40" width="300" height="46" rx="8" fill="#ffffff" stroke="#66bb6a" stroke-width="1.4" filter="url(#fCard)"/>
    <text x="470" y="58" class="mTitle">本地 AI 应用</text>
    <text x="470" y="76" class="mSub">知识管理 · 本地智能体 · 多模态应用</text>
    <text x="926" y="66" class="note">通过标准接口访问推理能力，无需感知底层框架与硬件差异</text>
  </g>

  <!-- 请求/结果（应用层 ↔ 统一接入层） -->
  <line x1="505" y1="182" x2="505" y2="198" class="req" marker-end="url(#mDark)"/>
  <text x="498" y="193" class="flowLb" text-anchor="end">推理请求</text>
  <line x1="575" y1="198" x2="575" y2="182" class="res" marker-end="url(#mGreen)"/>
  <text x="582" y="193" class="flowLb">推理结果</text>

  <!-- ================= ② 统一接入层 ================= -->
  <g transform="translate(70,198)">
    <rect x="0" y="0" width="940" height="112" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.6" filter="url(#fLayer)"/>
    <path d="M0,30 V10 Q0,0 10,0 H930 Q940,0 940,10 V30 Z" fill="url(#gBlue)"/>
    <text x="14" y="21" class="hdr">② 统一接入层 — 框架适配与统一接入网关</text>
    <rect x="20" y="40" width="290" height="62" rx="8" fill="#ffffff" stroke="#42a5f5" stroke-width="1.4" filter="url(#fCard)"/>
    <text x="165" y="62" class="mTitle">标准推理接口</text>
    <text x="165" y="82" class="mSub">接口标准化 · 统一 API</text>
    <rect x="325" y="40" width="290" height="62" rx="8" fill="#ffffff" stroke="#42a5f5" stroke-width="1.4" filter="url(#fCard)"/>
    <text x="470" y="62" class="mTitle">框架适配 · 位置透明化</text>
    <text x="470" y="82" class="mSub">屏蔽框架与硬件差异</text>
    <rect x="630" y="40" width="290" height="62" rx="8" fill="#ffffff" stroke="#42a5f5" stroke-width="1.4" filter="url(#fCard)"/>
    <text x="775" y="56" class="mTitle">类 Serverless 按需拉起</text>
    <text x="775" y="74" class="mSub">已驻留 → 直接转发</text>
    <text x="775" y="90" class="mSub">未驻留 → 调用部署 API 拉起</text>
  </g>

  <!-- 部署指令（统一接入层 → 调度层） -->
  <line x1="505" y1="312" x2="505" y2="328" class="req" marker-end="url(#mDark)"/>
  <text x="498" y="323" class="flowLb" text-anchor="end">模型部署 API（未驻留时调用）</text>

  <!-- ================= ③ 调度层（核心） ================= -->
  <g transform="translate(70,328)">
    <rect x="0" y="0" width="940" height="200" rx="10" fill="#fff3e0" stroke="#ef6c00" stroke-width="2.4" filter="url(#fLayer)"/>
    <path d="M0,30 V10 Q0,0 10,0 H930 Q940,0 940,10 V30 Z" fill="url(#gOrange)"/>
    <text x="14" y="21" class="hdr">③ 调度层 — 确定性调度算法（核心发明）</text>
    <text x="926" y="21" class="hdrR">调度决策由确定性算法完成，不依赖任何 AI 模型</text>

    <rect x="14" y="40" width="172" height="62" rx="8" fill="#ffffff" stroke="#ffb74d" stroke-width="1.4" filter="url(#fCard)"/>
    <text x="100" y="62" class="mTitle">S1 多框架路由决策</text>
    <text x="100" y="82" class="mSubSm">路由代价择优</text>

    <rect x="199" y="40" width="172" height="62" rx="8" fill="#ffffff" stroke="#ffb74d" stroke-width="1.4" filter="url(#fCard)"/>
    <text x="285" y="62" class="mTitle">S2 设备-模型匹配</text>
    <text x="285" y="82" class="mSubSm">大→GPU · 小→CPU/NPU</text>

    <rect x="384" y="40" width="172" height="62" rx="8" fill="#ffffff" stroke="#ffb74d" stroke-width="1.4" filter="url(#fCard)"/>
    <text x="470" y="62" class="mTitle">S3 精度自适应切换</text>
    <text x="470" y="82" class="mSubSm">FP16/FP8/INT8/INT4 阶梯</text>

    <rect x="569" y="40" width="172" height="62" rx="8" fill="#ffffff" stroke="#ffb74d" stroke-width="1.4" filter="url(#fCard)"/>
    <text x="655" y="62" class="mTitle">S4 加载/卸载/切换</text>
    <text x="655" y="82" class="mSubSm">按需驻留 · 驱逐决策</text>

    <rect x="754" y="40" width="172" height="62" rx="8" fill="#ffffff" stroke="#ffb74d" stroke-width="1.4" filter="url(#fCard)"/>
    <text x="840" y="62" class="mTitle">S5 内存监测与防护</text>
    <text x="840" y="82" class="mSubSm">周期采样 · 阈值分级</text>

    <line x1="186" y1="71" x2="197" y2="71" class="req" marker-end="url(#mDark)"/>
    <line x1="371" y1="71" x2="382" y2="71" class="req" marker-end="url(#mDark)"/>
    <line x1="556" y1="71" x2="567" y2="71" class="req" marker-end="url(#mDark)"/>
    <line x1="741" y1="71" x2="752" y2="71" class="req" marker-end="url(#mDark)"/>

    <path d="M840,104 C840,134 470,134 470,106" class="fb" marker-end="url(#mRed)"/>
    <text x="655" y="120" class="fbLb">内存压力反馈 · 触发精度降级</text>

    <rect x="120" y="142" width="700" height="44" rx="8" fill="#ffe0b2" stroke="#ef6c00" stroke-width="1.4" filter="url(#fCard)"/>
    <text x="470" y="160" class="banT">调度粒度：模型 — 框架 — 设备 — 精度（四元组）</text>
    <text x="470" y="178" class="mSub">突破单一框架、单一厂商硬件的调度边界</text>
  </g>

  <!-- 调度指令（调度层 → 推理框架服务层） -->
  <line x1="505" y1="530" x2="505" y2="546" class="req" marker-end="url(#mDark)"/>
  <text x="498" y="541" class="flowLb" text-anchor="end">加载 / 卸载 / 精度切换指令</text>

  <!-- ================= ④ 推理框架服务层（三框架） ================= -->
  <g transform="translate(70,546)">
    <rect x="0" y="0" width="940" height="150" rx="10" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.6" filter="url(#fLayer)"/>
    <path d="M0,30 V10 Q0,0 10,0 H930 Q940,0 940,10 V30 Z" fill="url(#gPurple)"/>
    <text x="14" y="21" class="hdr">④ 推理框架服务层 — 多框架独立服务进程并存（跨操作系统环境）</text>

    <rect x="12" y="40" width="292" height="96" rx="8" fill="#ffffff" stroke="#ab47bc" stroke-width="1.4" filter="url(#fCard)"/>
    <text x="158" y="58" class="mTitle">SGLang / vLLM</text>
    <line x1="24" y1="66" x2="292" y2="66" class="sep"/>
    <text x="158" y="82" class="mSub">运行环境：Linux / WSL</text>
    <text x="158" y="98" class="mSub">硬件：独立 GPU</text>
    <text x="158" y="114" class="mSub">特性：高吞吐 · CUDA 高性能</text>

    <rect x="324" y="40" width="292" height="96" rx="8" fill="#ffffff" stroke="#ab47bc" stroke-width="1.4" filter="url(#fCard)"/>
    <text x="470" y="58" class="mTitle">Ollama / llama.cpp</text>
    <line x1="336" y1="66" x2="604" y2="66" class="sep"/>
    <text x="470" y="82" class="mSub">运行环境：Windows / Linux</text>
    <text x="470" y="98" class="mSub">硬件：独立 GPU / CPU</text>
    <text x="470" y="114" class="mSub">特性：多量化精度选择</text>

    <rect x="636" y="40" width="292" height="96" rx="8" fill="#ffffff" stroke="#ab47bc" stroke-width="1.4" filter="url(#fCard)"/>
    <text x="782" y="58" class="mTitle">OpenVINO / OVMS</text>
    <line x1="648" y1="66" x2="916" y2="66" class="sep"/>
    <text x="782" y="82" class="mSub">运行环境：Windows / Linux</text>
    <text x="782" y="98" class="mSub">硬件：Intel CPU / NPU / Arc</text>
    <text x="782" y="114" class="mSub">特性：Intel 硬件高效推理</text>
  </g>

  <!-- 框架-设备绑定（推理框架服务层 → 硬件层） -->
  <line x1="228" y1="682" x2="228" y2="752" class="bind" marker-end="url(#mGray)"/>
  <line x1="468" y1="682" x2="300" y2="752" class="bind" marker-end="url(#mGray)"/>
  <line x1="540" y1="682" x2="540" y2="752" class="bind" marker-end="url(#mGray)"/>
  <line x1="780" y1="682" x2="612" y2="752" class="bind" marker-end="url(#mGray)"/>
  <line x1="852" y1="682" x2="852" y2="752" class="bind" marker-end="url(#mGray)"/>

  <!-- ================= ⑤ 硬件层 ================= -->
  <g transform="translate(70,714)">
    <rect x="0" y="0" width="940" height="150" rx="10" fill="#eceff1" stroke="#37474f" stroke-width="1.6" filter="url(#fLayer)"/>
    <path d="M0,30 V10 Q0,0 10,0 H930 Q940,0 940,10 V30 Z" fill="url(#gDark)"/>
    <text x="14" y="21" class="hdr">⑤ 硬件层 — 多厂商异构计算单元（设备能力描述抽象）</text>

    <rect x="12" y="40" width="292" height="92" rx="8" fill="#ffffff" stroke="#78909c" stroke-width="1.4" filter="url(#fCard)"/>
    <text x="158" y="60" class="mTitle">独立 GPU</text>
    <line x1="24" y1="68" x2="292" y2="68" class="sep"/>
    <text x="158" y="84" class="mSub">厂商：NVIDIA / AMD</text>
    <text x="158" y="100" class="mSub">高并行算力 · 显存带宽高</text>
    <text x="158" y="116" class="mSub">显存有限(8~32G) · 大模型推理主力</text>

    <rect x="324" y="40" width="292" height="92" rx="8" fill="#ffffff" stroke="#78909c" stroke-width="1.4" filter="url(#fCard)"/>
    <text x="470" y="60" class="mTitle">CPU</text>
    <line x1="336" y1="68" x2="604" y2="68" class="sep"/>
    <text x="470" y="84" class="mSub">厂商：Intel / AMD</text>
    <text x="470" y="100" class="mSub">通用性强 · 模型架构兼容性最好</text>
    <text x="470" y="116" class="mSub">并行算力与能效较低 · 兜底运行</text>

    <rect x="636" y="40" width="292" height="92" rx="8" fill="#ffffff" stroke="#78909c" stroke-width="1.4" filter="url(#fCard)"/>
    <text x="782" y="60" class="mTitle">NPU</text>
    <line x1="648" y1="68" x2="916" y2="68" class="sep"/>
    <text x="782" y="84" class="mSub">厂商：Intel / AMD / Qualcomm</text>
    <text x="782" y="100" class="mSub">低功耗 · 高能效 · 专用 AI 推理</text>
    <text x="782" y="116" class="mSub">适合嵌入/重排等小模型后台常驻</text>
  </g>

  <!-- 运行时内存监测反馈（硬件层 → 调度层，右侧） -->
  <path d="M1010,789 L1038,789 L1038,428 L1012,428" class="fb" marker-end="url(#mRed)"/>
  <text transform="translate(1054,608) rotate(-90)" class="fbLb">运行时内存状态采样 / 压力反馈</text>

  <!-- ================= 图例 ================= -->
  <g transform="translate(70,886)">
    <rect x="0" y="0" width="940" height="78" rx="10" fill="#ffffff" stroke="#cfd8dc" stroke-width="1.2"/>
    <line x1="20" y1="22" x2="58" y2="22" class="req" marker-end="url(#mDark)"/>
    <text x="66" y="26" class="lgT">推理请求 / 部署与调度指令（自顶向下）</text>
    <line x1="330" y1="22" x2="368" y2="22" class="res" marker-end="url(#mGreen)"/>
    <text x="376" y="26" class="lgT">推理结果（自底向上）</text>
    <line x1="560" y1="22" x2="598" y2="22" class="fb" marker-end="url(#mRed)"/>
    <text x="606" y="26" class="lgT">内存压力反馈 / 运行时监测</text>
    <line x1="20" y1="46" x2="58" y2="46" class="bind" marker-end="url(#mGray)"/>
    <text x="66" y="50" class="lgT">框架-设备绑定（F(m,d) = F_bound(d) ∩ F_compat(m)）</text>
    <text x="66" y="68" class="lgNote">注：调度决策由确定性算法完成（基于内存约束、代价函数与启发式规则），不依赖任何 AI 模型；调度粒度为「模型 — 框架 — 设备 — 精度」四元组。</text>
  </g>
</svg>